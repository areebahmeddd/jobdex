user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $remote_addr is the Cloudflare edge IP; real client IP is in CF-Connecting-IP
    log_format main '$http_cf_connecting_ip - [$time_local] "$request" $status "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # CF-Connecting-IP is the real client IP; $remote_addr resolves to the Cloudflare edge node
    limit_req_zone $http_cf_connecting_ip zone=api:10m rate=60r/m;
    limit_req_zone $http_cf_connecting_ip zone=map_heavy:10m rate=15r/m;
    limit_conn_zone $http_cf_connecting_ip zone=conn:10m;

    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # /map/ - stricter rate limit for heavy DB routes
        location /map/ {
            limit_req zone=api burst=20 nodelay;
            limit_req zone=map_heavy burst=5 nodelay;
            limit_conn conn 10;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 10;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        }
    }
}
